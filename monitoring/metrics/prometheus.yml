global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter (System metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor (Container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Docker Engine API (if enabled)
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:2375']
    metrics_path: /metrics

  # LocalAI Stack Services
  - job_name: 'localai-stack'
    static_configs:
      - targets: 
        - 'host.docker.internal:5679'   # N8N
        - 'host.docker.internal:8080'   # Open-WebUI
        - 'host.docker.internal:3001'   # Flowise
        - 'host.docker.internal:6333'   # Qdrant
        - 'host.docker.internal:8123'   # ClickHouse
        - 'host.docker.internal:9011'   # MinIO Console
        - 'host.docker.internal:3000'   # Langfuse
        - 'host.docker.internal:7474'   # Neo4j
    scrape_interval: 30s
    metrics_path: /metrics

  # Ollama API
  - job_name: 'ollama'
    static_configs:
      - targets: ['host.docker.internal:11435']
    scrape_interval: 30s
    metrics_path: /api/metrics

  # Supabase Stack
  - job_name: 'supabase'
    static_configs:
      - targets:
        - 'host.docker.internal:8000'   # Kong API Gateway
        - 'host.docker.internal:3000'   # Studio
        - 'host.docker.internal:5432'   # PostgreSQL
    scrape_interval: 30s

  # Custom monitoring dashboard
  - job_name: 'localai-monitor'
    static_configs:
      - targets: ['host.docker.internal:8888']
    scrape_interval: 15s
    metrics_path: /metrics
