name: Regression Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "document-processor/**"
      - ".github/workflows/**"
      - "docker-compose.yml"
      - "infra/**"
      - "localai-admin-dashboard/src/**"

env:
  NODE_VERSION: "20"

jobs:
  # ── File-based regression tests ──────────────────────────────────────────
  # Validates workflow YAML, docker-compose, and Bicep contain required
  # configuration. Does NOT need running services — only reads files.
  config-validation:
    name: Config & CORS Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: localai-admin-dashboard/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: localai-admin-dashboard
        run: pnpm install --frozen-lockfile

      - name: Run config regression tests
        working-directory: localai-admin-dashboard
        run: |
          npx vitest run src/__tests__/integration/env-services-regression.test.ts \
            src/__tests__/integration/document-id-validation.test.ts \
            --reporter=verbose \
            --testNamePattern="CI/CD Workflow|Docker Compose|CORS: Container App|Document ID Validation: Source Code|Document ID Validation: Upload"
        env:
          # Provide dummy values so Vitest doesn't fail on missing env vars
          # (only file-validation tests run via --testNamePattern)
          VITE_SENDGRID_API_KEY: "ci-placeholder"
          VITE_POSTHOG_KEY: "phc_ci-placeholder"
          VITE_POSTHOG_HOST: "https://us.i.posthog.com"

  # ── Dashboard build check ────────────────────────────────────────────────
  # Ensures frontend still builds cleanly after any infra changes
  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: localai-admin-dashboard/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: localai-admin-dashboard
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: localai-admin-dashboard
        run: pnpm build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder"
          VITE_DOCUMENT_PROCESSOR_URL: "https://placeholder.azurecontainerapps.io"

  # ── Production smoke ─────────────────────────────────────────────────────
  # Runs CORS + PDF upload e2e against live fetchtext.io.
  # On PRs: validates current production is healthy (catches drift).
  # On main push: validates the new deployment after deploy workflows finish.
  # NEVER skipped — tests must always run.
  production-smoke:
    name: Production CORS Smoke
    runs-on: ubuntu-latest
    needs: [config-validation, dashboard-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: localai-admin-dashboard/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: localai-admin-dashboard
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: localai-admin-dashboard
        run: npx playwright install --with-deps chromium

      - name: Wait for deploy workflows (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Post-deploy: waiting 90s for deploy workflows to finish..."
          sleep 90

      - name: Create production env file
        working-directory: localai-admin-dashboard
        run: |
          cat > .env.e2e.production <<EOF
          PROD_TEST_USER_EMAIL=${{ secrets.PROD_TEST_USER_EMAIL }}
          PROD_TEST_USER_PASSWORD=${{ secrets.PROD_TEST_USER_PASSWORD }}
          PROD_BACKEND_URL=${{ secrets.VITE_DOCUMENT_PROCESSOR_URL }}
          SUPABASE_PROD_URL=${{ secrets.VITE_SUPABASE_URL }}
          EOF

      - name: Verify backend is reachable
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf "${{ secrets.VITE_DOCUMENT_PROCESSOR_URL }}/health" --max-time 15 > /dev/null 2>&1; then
              echo "Backend is healthy (attempt $i)"
              break
            fi
            echo "Backend not ready (attempt $i/6), waiting 30s..."
            sleep 30
          done

      - name: Run production CORS e2e test
        working-directory: localai-admin-dashboard
        run: |
          npx playwright test \
            --config=playwright.production.config.ts \
            tests/e2e/production/pdf-upload-production.pw.spec.ts \
            --reporter=list \
            --retries=1
        env:
          CI: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-report
          path: /tmp/test-results-production/
          retention-days: 7
