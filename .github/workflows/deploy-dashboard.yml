name: Deploy Dashboard (Static Web App)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "localai-admin-dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"

env:
  NODE_VERSION: "20"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: localai-admin-dashboard/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: localai-admin-dashboard
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        working-directory: localai-admin-dashboard
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DOCUMENT_PROCESSOR_URL: ${{ secrets.VITE_DOCUMENT_PROCESSOR_URL }}
          VITE_N8N_URL: ${{ secrets.VITE_N8N_URL }}
          VITE_OLLAMA_URL: ${{ secrets.VITE_OLLAMA_URL }}
          VITE_APP_URL: https://fetchtext.io
        run: pnpm build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "localai-admin-dashboard/dist"
          skip_app_build: true
          skip_api_build: true
