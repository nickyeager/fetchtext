name: Deploy Document Processor (Container App)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "document-processor/**"
      - ".github/workflows/deploy-container-app.yml"

env:
  AZURE_CONTAINERAPPS_RESOURCE_GROUP: ${{ secrets.AZURE_CONTAINERAPPS_RESOURCE_GROUP }}
  AZURE_CONTAINERAPP_NAME: ${{ secrets.AZURE_CONTAINERAPP_NAME }}
  AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
  IMAGE_NAME: document-processor

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Container Registry Login
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.AZURE_ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and push image
        run: |
          docker build \
            -t ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            -f document-processor/Dockerfile \
            document-processor
          docker push ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Validate CORS configuration
        run: |
          ALLOWED="https://fetchtext.io,https://www.fetchtext.io"
          if ! echo "$ALLOWED" | grep -q "https://fetchtext.io"; then
            echo "::error::ALLOWED_ORIGINS missing production frontend URL"
            exit 1
          fi
          echo "CORS configuration validated: $ALLOWED"

      - name: Sync Container App secrets
        env:
          SUPABASE_URL_SECRET: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_OPENAI_KEY_SECRET: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT_SECRET: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          SENDGRID_KEY_SECRET: ${{ secrets.SENDGRID_API_KEY }}
          QDRANT_KEY_SECRET: ${{ secrets.QDRANT_API_KEY }}
          JWT_SECRET_VALUE: ${{ secrets.JWT_SECRET }}
          MICROSOFT_CLIENT_ID_SECRET: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: |
          # Build secrets list (jwt-secret is optional — auth falls back to Supabase API)
          SECRETS_ARGS=(
            supabase-url="$SUPABASE_URL_SECRET"
            supabase-anon-key="$SUPABASE_ANON_SECRET"
            supabase-service-role="$SUPABASE_SERVICE_ROLE_SECRET"
            azure-openai-key="$AZURE_OPENAI_KEY_SECRET"
            azure-openai-endpoint="$AZURE_OPENAI_ENDPOINT_SECRET"
            sendgrid-api-key="$SENDGRID_KEY_SECRET"
            qdrant-api-key="$QDRANT_KEY_SECRET"
          )
          if [ -n "$JWT_SECRET_VALUE" ]; then
            SECRETS_ARGS+=(jwt-secret="$JWT_SECRET_VALUE")
            echo "Including JWT_SECRET in container secrets"
          else
            echo "::warning::JWT_SECRET not set — auth will use Supabase API fallback"
          fi
          if [ -n "$MICROSOFT_CLIENT_ID_SECRET" ]; then
            SECRETS_ARGS+=(microsoft-client-id="$MICROSOFT_CLIENT_ID_SECRET")
            SECRETS_ARGS+=(microsoft-client-secret="$MICROSOFT_CLIENT_SECRET_SECRET")
            echo "Including Microsoft OAuth secrets"
          else
            echo "::warning::MICROSOFT_CLIENT_ID not set — SharePoint integration disabled"
          fi
          az containerapp secret set \
            --name "$AZURE_CONTAINERAPP_NAME" \
            --resource-group "$AZURE_CONTAINERAPPS_RESOURCE_GROUP" \
            --secrets "${SECRETS_ARGS[@]}"

      - name: Update Container App
        env:
          JWT_SECRET_VALUE: ${{ secrets.JWT_SECRET }}
          MICROSOFT_CLIENT_ID_SECRET: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          # Build env vars list (JWT_SECRET is optional)
          ENV_VARS=(
            AZURE_OPENAI_API_KEY=secretref:azure-openai-key
            AZURE_OPENAI_ENDPOINT=secretref:azure-openai-endpoint
            AZURE_OPENAI_DEPLOYMENT_NAME=${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
            AZURE_OPENAI_API_VERSION=${{ secrets.AZURE_OPENAI_API_VERSION }}
            SUPABASE_URL=secretref:supabase-url
            SUPABASE_ANON_KEY=secretref:supabase-anon-key
            SERVICE_ROLE_KEY=secretref:supabase-service-role
            SENDGRID_API_KEY=secretref:sendgrid-api-key
            SENDGRID_FROM_EMAIL=nick@fetchtext.io
            SENDGRID_FROM_NAME=FetchText
            APP_URL=https://fetchtext.io
            "ALLOWED_ORIGINS=https://fetchtext.io,https://www.fetchtext.io"
            QDRANT_HOST=localhost
            QDRANT_PORT=6333
            QDRANT_API_KEY=secretref:qdrant-api-key
          )
          if [ -n "$JWT_SECRET_VALUE" ]; then
            ENV_VARS+=(JWT_SECRET=secretref:jwt-secret)
          fi
          if [ -n "$MICROSOFT_CLIENT_ID_SECRET" ]; then
            ENV_VARS+=(MICROSOFT_CLIENT_ID=secretref:microsoft-client-id)
            ENV_VARS+=(MICROSOFT_CLIENT_SECRET=secretref:microsoft-client-secret)
          fi
          az containerapp update \
            --name "$AZURE_CONTAINERAPP_NAME" \
            --resource-group "$AZURE_CONTAINERAPPS_RESOURCE_GROUP" \
            --container-name "$AZURE_CONTAINERAPP_NAME" \
            --image "${AZURE_ACR_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}" \
            --set-env-vars "${ENV_VARS[@]}"

      - name: Wait for deployment to stabilize
        run: |
          echo "Waiting 60s for container to start..."
          sleep 60

      - name: CORS preflight smoke test
        env:
          BACKEND_URL: ${{ secrets.VITE_DOCUMENT_PROCESSOR_URL }}
        run: |
          echo "Testing CORS preflight against $BACKEND_URL..."

          # Wait for backend to be reachable (cold-start can take 30-60s)
          for i in 1 2 3 4 5; do
            if curl -sf "${BACKEND_URL}/health" --max-time 15 > /dev/null 2>&1; then
              echo "Backend is healthy (attempt $i)"
              break
            fi
            echo "Backend not ready yet (attempt $i/5), waiting 15s..."
            sleep 15
          done

          # Test 1: OPTIONS preflight request
          RESPONSE=$(curl -s -D - -o /dev/null -X OPTIONS \
            -H "Origin: https://fetchtext.io" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: Content-Type" \
            "${BACKEND_URL}/health" --max-time 30 || true)

          if echo "$RESPONSE" | grep -qi "access-control-allow-origin"; then
            echo "CORS preflight check PASSED"
          else
            echo "::error::CORS preflight FAILED - no Access-Control-Allow-Origin header"
            echo "Response headers:"
            echo "$RESPONSE"
            exit 1
          fi

          # Test 2: /health/cors endpoint
          CORS_DATA=$(curl -s "${BACKEND_URL}/health/cors" --max-time 30 || true)
          if echo "$CORS_DATA" | grep -q "fetchtext.io"; then
            echo "CORS config endpoint check PASSED"
            echo "$CORS_DATA"
          else
            echo "::error::CORS config endpoint does not include fetchtext.io"
            echo "Response: $CORS_DATA"
            exit 1
          fi
