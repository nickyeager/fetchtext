name: Deploy Document Processor (Container App)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "document-processor/**"
      - ".github/workflows/deploy-container-app.yml"

env:
  AZURE_CONTAINERAPPS_RESOURCE_GROUP: ${{ secrets.AZURE_CONTAINERAPPS_RESOURCE_GROUP }}
  AZURE_CONTAINERAPP_NAME: ${{ secrets.AZURE_CONTAINERAPP_NAME }}
  AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
  IMAGE_NAME: document-processor

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Container Registry Login
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.AZURE_ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: document-processor
          file: document-processor/Dockerfile
          push: true
          tags: |
            ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Validate CORS configuration
        run: |
          ALLOWED="https://fetchtext.io,https://www.fetchtext.io"
          if ! echo "$ALLOWED" | grep -q "https://fetchtext.io"; then
            echo "::error::ALLOWED_ORIGINS missing production frontend URL"
            exit 1
          fi
          echo "CORS configuration validated: $ALLOWED"

      - name: Sync Container App secrets
        env:
          SUPABASE_URL_SECRET: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_SECRET: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_OPENAI_KEY_SECRET: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          az containerapp secret set \
            --name "$AZURE_CONTAINERAPP_NAME" \
            --resource-group "$AZURE_CONTAINERAPPS_RESOURCE_GROUP" \
            --secrets \
              supabase-url="$SUPABASE_URL_SECRET" \
              supabase-anon-key="$SUPABASE_ANON_SECRET" \
              supabase-service-role="$SUPABASE_SERVICE_ROLE_SECRET" \
              azure-openai-key="$AZURE_OPENAI_KEY_SECRET"

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINERAPP_NAME" \
            --resource-group "$AZURE_CONTAINERAPPS_RESOURCE_GROUP" \
            --image "${AZURE_ACR_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA}" \
            --set-env-vars \
              AZURE_OPENAI_API_KEY=secretref:azure-openai-key \
              SUPABASE_URL=secretref:supabase-url \
              SUPABASE_ANON_KEY=secretref:supabase-anon-key \
              SERVICE_ROLE_KEY=secretref:supabase-service-role \
              ALLOWED_ORIGINS="https://fetchtext.io,https://www.fetchtext.io"

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: CORS preflight smoke test
        env:
          BACKEND_URL: ${{ secrets.VITE_DOCUMENT_PROCESSOR_URL }}
        run: |
          echo "Testing CORS preflight against $BACKEND_URL..."

          # Test 1: OPTIONS preflight request
          RESPONSE=$(curl -s -D - -o /dev/null -X OPTIONS \
            -H "Origin: https://fetchtext.io" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: Content-Type" \
            "${BACKEND_URL}/health" --max-time 30 || true)

          if echo "$RESPONSE" | grep -qi "access-control-allow-origin"; then
            echo "CORS preflight check PASSED"
          else
            echo "::error::CORS preflight FAILED - no Access-Control-Allow-Origin header"
            echo "Response headers:"
            echo "$RESPONSE"
            exit 1
          fi

          # Test 2: /health/cors endpoint
          CORS_DATA=$(curl -s "${BACKEND_URL}/health/cors" --max-time 30 || true)
          if echo "$CORS_DATA" | grep -q "fetchtext.io"; then
            echo "CORS config endpoint check PASSED"
            echo "$CORS_DATA"
          else
            echo "::error::CORS config endpoint does not include fetchtext.io"
            echo "Response: $CORS_DATA"
            exit 1
          fi
