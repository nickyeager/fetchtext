name: Feature request
description: Suggest an improvement or new capability for fetchtext.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! A clear use case and a smallest-useful first version helps the maintainer scope the work.

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do, and where does fetchtext fall short today?
      placeholder: "Batch-process ~500 scanned receipts per night and emit a single CSV per run."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: The smallest, most concrete thing fetchtext could ship that would solve the use case.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you tried or rejected, and why. Include workarounds if you have them.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, related issues, or references that help frame the request.
    validations:
      required: false
